pluginManagement {
    repositories {
        gradlePluginPortal()
        maven {
            url = "https://maven.fabricmc.net/"
        }
        maven {
            url = "https://maven.neoforged.net/releases"
        }
        exclusiveContent {
            forRepository {
                maven {
                    name = "Modrinth"
                    url = "https://api.modrinth.com/maven"
                }
            }
            filter {
                includeGroup "maven.modrinth"
            }
        }
        mavenCentral()
    }
}

dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.PREFER_PROJECT)
    repositories {
        maven {
            url = "https://maven.fabricmc.net/"
        }
        maven {
            url = "https://maven.neoforged.net/releases"
        }
        mavenCentral()
    }
}

rootProject.name = "mc-dlss-prototype"

include(
    "mc-dlss-core",
    "mc-dlss-debug",
    "mc-dlss-fabric",
    "mc-dlss-neoforge"
)
